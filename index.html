function getDirectSmpsSpec(targetLength) {
    if (targetLength <= 50)
        return DIRECT_SMPS_DATA[DIRECT_SMPS_DATA.length - 1];
    if (targetLength >= 3000)
        return DIRECT_SMPS_DATA[0];
    const rounded = Math.round(targetLength / 50) * 50;
    const found = DIRECT_SMPS_DATA.find(s => s.length === rounded);
    if (found)
        return found;
    let closest = DIRECT_SMPS_DATA[0];
    let minDiff = Math.abs(targetLength - closest.length);
    for (const item of DIRECT_SMPS_DATA) {
        const diff = Math.abs(targetLength - item.length);
        if (diff < minDiff) {
            minDiff = diff;
            closest = item;
        }
    }
    return closest;
}

function calculateLedCombinations(targetLength) {
    const list = [];
    let caseNo = 0;
    const max500 = Math.floor(targetLength / 500);
    for (let c500 = max500; c500 >= 0; c500--) {
        const rem500 = targetLength - c500 * 500;
        const max450 = Math.floor(rem500 / 450);
        for (let c450 = max450; c450 >= 0; c450--) {
            const rem450 = rem500 - c450 * 450;
            const max400 = Math.floor(rem450 / 400);
            for (let c400 = max400; c400 >= 0; c400--) {
                const rem400 = rem450 - c400 * 400;
                if (rem400 % 300 === 0) {
                    const c300 = rem400 / 300;
                    caseNo++;
                    const totalPcb = c500 + c450 + c400 + c300;
                    const hasBoth = c400 > 0 && c300 > 0;
                    const parts = [];
                    for (let i = 0; i < c500; i++)
                        parts.push(500);
                    for (let i = 0; i < c450; i++)
                        parts.push(450);
                    for (let i = 0; i < c400; i++)
                        parts.push(400);
                    for (let i = 0; i < c300; i++)
                        parts.push(300);
                    const selKey = `${String(targetLength).padStart(4, '0')}${hasBoth ? '1' : '0'}${String(totalPcb).padStart(4, '0')}${String(caseNo).padStart(4, '0')}`;
                    list.push({
                        caseNo,
                        combination: parts.join('+') || '0',
                        c500, c450, c400, c300,
                        totalPcb,
                        checkSum: c500 * 500 + c450 * 450 + c400 * 400 + c300 * 300,
                        hasBoth400And300: hasBoth,
                        selectionKey: selKey
                    });
                }
            }
        }
    }
    list.sort((a, b) => {
        if (a.hasBoth400And300 !== b.hasBoth400And300) {
            return a.hasBoth400And300 ? 1 : -1;
        }
        if (a.totalPcb !== b.totalPcb) {
            return a.totalPcb - b.totalPcb;
        }
        return a.caseNo - b.caseNo;
    });
    return list;
}

        const cuttingLen = bodyLen;
        const bodyCount = 2;
        const tBracketLen = Math.max(0, ceilingLen - config.tBracketDeduction);
        const tBracketCutting = Math.round(tBracketLen / 2);
        const tBracketCount = 4;
        const directDiffuserLength = bodyLen + config.diffuserAddition;
        const coverLength = Math.max(0, ceilingLen - config.coverDeduction);
        const indirectLength = Math.round(ceilingLen / 2 - config.indirectSubConstant);
        const indirectCount = 4;
        // 직하 SMPS
        const directSmpsLen = type === '2S' ? Math.round(ceilingLen / 2) : ceilingLen;
        const directSmpsCount = type === '2S' ? 4 : 2;
        const directSmpsSpec = getDirectSmpsSpec(directSmpsLen);
        // 간접 SMPS (우물천장길이 - 500mm 기준 제원표 매핑!)
        const indirectSmpsSpec = getIndirectSmpsSpec(ceilingLen);
        const indirectSmpsCount = indirectSmpsSpec.type === '2S' ? 4 : 2;
        const directLedCombo = getBestLedCombination(bodyLen) || {
            caseNo: 1, combination: 'N/A', c500: 0, c450: 0, c400: 0, c300: 0,
            totalPcb: 0, checkSum: 0, hasBoth400And300: false, selectionKey: ''
        };

            caseNo: 1, combination: 'N/A', c500: 0, c450: 0, c400: 0, c300: 0,
            totalPcb: 0, checkSum: 0, hasBoth400And300: false, selectionKey: ''
        };
        const bodyPowerCableLen = Math.max(0, bodyLen - config.bodyPowerCableDeduction);
        return {
            ceilingLength: ceilingLen,
            type,
            bodyLength: bodyLen,
            cuttingLength: cuttingLen,
            bodyCount,
            tBracketLength: tBracketLen,
            tBracketCutting,
            tBracketCount,
            directDiffuserLength,
            coverLength,
            indirectLength,
            indirectCount,
            directSmpsLen,
            directSmpsSpec,
            directSmpsCount,
            indirectSmpsSpec,
            indirectSmpsCount,
            directLedCombo,
            indirectLedCombo,
            bodyPowerCableLen

// 엑셀 표 서식: 값이 채워진 연속 행을 하나의 표로 보고 테두리/머리글 색/정렬을 입힌다.
function styleSheetAsTables(ws) {
    if (!ws['!ref']) return;
    var range = XLSX.utils.decode_range(ws['!ref']);
    var thin = { style: 'thin', color: { rgb: '94A3B8' } };
    var border = { top: thin, bottom: thin, left: thin, right: thin };
    function cellAt(r, c) { return ws[XLSX.utils.encode_cell({ r: r, c: c })]; }
    function filled(r, c) { var x = cellAt(r, c); return x && x.v !== '' && x.v != null; }
    function rowCells(r) { var n = 0; for (var c = range.s.c; c <= range.e.c; c++) if (filled(r, c)) n++; return n; }
    function isHeading(r) { var x = cellAt(r, range.s.c); return x && typeof x.v === 'string' && /^(■|\[)/.test(x.v) && rowCells(r) <= 2; }
    function ensure(r, c) { var a = XLSX.utils.encode_cell({ r: r, c: c }); if (!ws[a]) ws[a] = { t: 's', v: '' }; return ws[a]; }
    var rows = ws['!rows'] = ws['!rows'] || [];
    // 0행: 제목, 1행: 현장 정보 줄
    var title = ensure(range.s.r, range.s.c);
    title.s = { font: { bold: true, sz: 15, color: { rgb: '1E1B4B' } }, alignment: { horizontal: 'center', vertical: 'center' } };
    rows[range.s.r] = { hpt: 28 };
    var r = range.s.r + 1;
    while (r <= range.e.r) {
        if (isHeading(r)) {
            for (var hc = range.s.c; hc <= range.e.c; hc++) if (filled(r, hc)) cellAt(r, hc).s = { font: { bold: true, sz: 12, color: { rgb: '3730A3' } } };
            r++; continue;
        }
        if (r === range.s.r + 1 || rowCells(r) < 2) { r++; continue; }
        // 표 블록 [r, end]
        var end = r;
        while (end + 1 <= range.e.r && rowCells(end + 1) >= 2 && !isHeading(end + 1)) end++;
        var cols = [];
        for (var c = range.s.c; c <= range.e.c; c++) {
            for (var rr = r; rr <= end; rr++) if (filled(rr, c)) { cols.push(c); break; }
        }
        var first = cols[0], last = cols[cols.length - 1];
        for (var rr2 = r; rr2 <= end; rr2++) {
            var head = rr2 === r && end > r;
            var lead = cellAt(rr2, first);
            var total = lead && typeof lead.v === 'string' && /합계|총/.test(lead.v);
            for (var c2 = first; c2 <= last; c2++) {
                if (cols.indexOf(c2) === -1) continue; // 블록 내 완전히 빈 열(구분용)은 비워 둔다
                var cell = ensure(rr2, c2);
                cell.s = {
                    border: border,
                    alignment: { horizontal: (head || typeof cell.v === 'number') ? 'center' : 'left', vertical: 'center', wrapText: true },
                    font: { bold: head || total, color: { rgb: head ? '1E1B4B' : '0F172A' } },
                    fill: head ? { patternType: 'solid', fgColor: { rgb: 'E0E7FF' } } : total ? { patternType: 'solid', fgColor: { rgb: 'F1F5F9' } } : undefined
                };
                if (typeof cell.v === 'number' && Math.abs(cell.v) >= 1000) cell.z = '#,##0';
            }
            if (head) rows[rr2] = { hpt: 22 };
        }
        r = end + 1;
    }
}
